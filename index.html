<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portable ATM Terminal & Dashboard</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Custom Stylesheet link -->
    <link rel="stylesheet" href="style.css">
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen p-4 md:p-6">
    <div class="max-w-xl mx-auto space-y-6">
        
        <!-- Live Dashboard Header -->
        <div class="bg-slate-800 rounded-xl shadow-xl p-5 border border-slate-700">
            <div class="flex justify-between items-center mb-4">
                <h2 class="text-lg font-bold text-slate-200">📊 Live ATM Dashboard</h2>
                <button onclick="fetchDashboardMetrics()" class="text-xs bg-slate-700 hover:bg-slate-600 px-3 py-1.5 rounded-lg text-slate-300 transition">
                    🔄 Refresh
                </button>
            </div>
            
            <div class="grid grid-cols-2 gap-3 mb-4">
                <div class="bg-slate-750 p-3 rounded-lg border border-slate-700">
                    <span class="text-xs text-slate-400 block">Current Balance</span>
                    <span id="dashBalance" class="text-xl font-bold text-emerald-400">₱0</span>
                </div>
                <div class="bg-slate-750 p-3 rounded-lg border border-slate-700">
                    <span class="text-xs text-slate-400 block">Transaction Fees Earned</span>
                    <span id="dashFees" class="text-xl font-bold text-amber-400">₱0</span>
                </div>
            </div>

            <!-- Denomination Inventory Badge Counters -->
            <div class="border-t border-slate-700 pt-3">
                <span class="text-xs text-slate-400 mb-2 block font-medium">Bills Remaining in Tray</span>
                <div class="grid grid-cols-3 gap-2 text-center">
                    <div class="bg-slate-900/60 p-2 rounded-lg border border-slate-700">
                        <span class="text-xs text-slate-400">₱100</span>
                        <p id="dash100" class="text-base font-bold text-indigo-400">0</p>
                    </div>
                    <div class="bg-slate-900/60 p-2 rounded-lg border border-slate-700">
                        <span class="text-xs text-slate-400">₱500</span>
                        <p id="dash500" class="text-base font-bold text-indigo-400">0</p>
                    </div>
                    <div class="bg-slate-900/60 p-2 rounded-lg border border-slate-700">
                        <span class="text-xs text-slate-400">₱1,000</span>
                        <p id="dash1000" class="text-base font-bold text-indigo-400">0</p>
                    </div>
                </div>
            </div>
        </div>

        <!-- Transaction Form -->
        <div class="bg-slate-800 rounded-xl shadow-xl p-6 border border-slate-700">
            <h1 class="text-xl font-bold mb-5 text-emerald-400 text-center">🏧 Transaction Entry</h1>
            
            <form id="atmForm" class="space-y-4">
                <div>
                    <label class="block text-sm font-medium mb-1">Transaction Type</label>
                    <select id="type" class="w-full bg-slate-700 border border-slate-600 rounded-lg p-2.5 text-white" onchange="toggleFields()">
                        <option value="Withdrawal">Withdrawal</option>
                        <option value="Cash Reload">Cash Reload</option>
                        <option value="Balance Inquiry">Balance Inquiry</option>
                    </select>
                </div>

                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="block text-sm font-medium mb-1">Date</label>
                        <input type="date" id="date" required class="w-full bg-slate-700 border border-slate-600 rounded-lg p-2.5 text-white">
                    </div>
                    <div>
                        <label class="block text-sm font-medium mb-1">Reference / Notes</label>
                        <input type="text" id="reference" placeholder="e.g. TXN001" class="w-full bg-slate-700 border border-slate-600 rounded-lg p-2.5 text-white">
                    </div>
                </div>

                <div>
                    <label class="block text-sm font-medium mb-1">Total Amount (₱)</label>
                    <input type="number" id="amount" required placeholder="0" class="w-full bg-slate-700 border border-slate-600 rounded-lg p-2.5 text-white font-bold text-lg">
                </div>

                <!-- Denominations Section -->
                <div id="denomSection" class="border border-slate-700 p-4 rounded-lg bg-slate-750 space-y-3">
                    <h3 id="denomTitle" class="text-sm font-semibold text-amber-400 uppercase tracking-wider">Bills Dispensed (OUT)</h3>
                    <div class="grid grid-cols-3 gap-3">
                        <div>
                            <label class="block text-xs mb-1">₱100 Bills</label>
                            <input type="number" id="b100" value="0" class="w-full bg-slate-700 border border-slate-600 rounded p-2 text-center">
                        </div>
                        <div>
                            <label class="block text-xs mb-1">₱500 Bills</label>
                            <input type="number" id="b500" value="0" class="w-full bg-slate-700 border border-slate-600 rounded p-2 text-center">
                        </div>
                        <div>
                            <label class="block text-xs mb-1">₱1000 Bills</label>
                            <input type="number" id="b1000" value="0" class="w-full bg-slate-700 border border-slate-600 rounded p-2 text-center">
                        </div>
                    </div>
                </div>

                <button type="submit" id="submitBtn" class="w-full bg-emerald-600 hover:bg-emerald-500 font-bold py-3 rounded-lg transition duration-200">
                    Submit Transaction
                </button>
            </form>

            <div id="statusMessage" class="mt-4 text-center text-sm hidden"></div>
        </div>

    </div>

    <!-- External JavaScript link -->
    <script src="script.js"></script>
</body>
</html>
